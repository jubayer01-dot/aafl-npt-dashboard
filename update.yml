name: Daily NPT Update
on:
  schedule:
    - cron: '0 0 * * *'  # 06:00 Dhaka (UTC 00:00)
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install google-api-python-client google-auth google-auth-oauthlib
      - name: Restore token
        run: echo "${{ secrets.GOOGLE_TOKEN }}" | base64 -d > google_token.pickle
      - run: python fetch_npt_line_data.py
      - run: |
          git config user.name "npt-bot"
          git config user.email "npt-bot@aafl.com"
          git add npt_line_data.json
          git diff --staged --quiet || (git commit -m "daily update $(date +%Y-%m-%d)" && git push)
